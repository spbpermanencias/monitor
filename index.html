<html lang="es">
<head>

<style>
:root{color-scheme:light;
  --bg:#F2F8FC;--panel:#fff;--ink:#0A2F5C;--muted:#52708E;--line:#D3E3F0;
  --blue:#0A55A5;--cyan:#19B5EA;--blue-soft:#E1F1FB;--navy:#0A55A5;--yellow:#FFC20E;
  --ok:#1E9E55;--c-media:#FFD54F;--c-total:#EF5350;
  --plate-bg:#FFCA08;--plate-ink:#111;--shadow:0 1px 4px rgba(10,85,165,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.mono{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#E1F1FB,#F2F8FC);border-top:6px solid var(--blue)}
.login form{width:100%;max-width:360px;background:var(--panel);border-radius:16px;padding:24px;display:grid;gap:12px;box-shadow:0 8px 30px rgba(10,85,165,.18)}
.login h1{margin:0;font-size:1.3rem}.login p{margin:0;color:var(--muted);font-size:.9rem}
.login label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.login input{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
.login input[name=u]{text-transform:lowercase}
.login .go{padding:13px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:1rem}
.login .go:disabled{opacity:.6}
.login .err{color:#C62828;font-size:.88rem;min-height:1.2em;margin:0}
.logo{width:100%;max-width:280px;height:auto;margin:0 auto 4px;display:block}

/* ---------- barra superior ---------- */
header.top{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:3px solid var(--blue);box-shadow:0 2px 8px rgba(10,85,165,.12)}
.t1{display:flex;align-items:center;gap:8px}
.emb{height:36px;width:auto}
.t1 h1{margin:0;color:var(--blue);font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#1E9E55;box-shadow:0 0 0 3px rgba(30,158,85,.22)}
.dot.off{background:#EF5350;box-shadow:0 0 0 3px rgba(239,83,80,.3)}
.clock{font-weight:700;font-size:.95rem}
.ib{background:var(--blue-soft);border:0;border-radius:8px;width:34px;height:34px;color:var(--blue);font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.ib.on{background:var(--yellow);color:#111}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sum button{border:1px solid var(--line);border-radius:10px;padding:6px 4px;background:var(--blue-soft);color:var(--ink);text-align:center;line-height:1.1}
.sum b{display:block;font-size:1.25rem}
.sum small{font-size:.68rem;opacity:.85;letter-spacing:.02em}
.sum button.sel{outline:2px solid var(--blue);background:#fff}
.sum b{color:var(--blue)}.sum .s-g b{color:#15803D}.sum .s-y b{color:#B45309}.sum .s-r b{color:#C62828}
.srch{margin-top:8px;position:relative}
.srch input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:.95rem;text-transform:uppercase}
.srch input::placeholder{color:#7F97AE;text-transform:none}
.srch button{position:absolute;right:4px;top:3px;width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:1rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--blue-soft);color:var(--blue);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip b{margin-left:4px;opacity:.85}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- lista ---------- */
main{padding:10px 10px 90px}
.banner{margin:0 0 8px;padding:8px 12px;border-radius:10px;background:#FFF3C4;color:#5C4500;font-size:.88rem}
.group{margin:0 0 14px}
.group h2{margin:6px 4px 6px;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h2 .n{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:1px 8px;font-size:.78rem}
.card{background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-left:6px solid var(--line);display:grid;gap:6px;width:100%;text-align:left;content-visibility:auto;contain-intrinsic-size:auto 120px}
.card.est-tiempo{border-left-color:var(--ok)}
.card.est-media{border-left-color:var(--c-media)}
.card.est-total{border-left-color:var(--c-total);border-color:var(--c-total);border-left-width:6px;background:color-mix(in srgb,var(--c-total) 10%,var(--panel))}
.card.espera{opacity:.6}
.r1{display:flex;align-items:center;gap:8px}
.tno{background:var(--blue);color:#fff;border-radius:8px;padding:2px 7px;font-weight:800;font-size:.85rem}
.plate{background:var(--plate-bg);color:var(--plate-ink);border:2px solid #111;border-radius:8px;padding:0 10px;font:800 1.45rem/1.25 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.06em}
.card.est-total .plate{border-color:#C62828;box-shadow:0 0 0 2px #C62828}
.fill{flex:1}
.timer{font-weight:800;font-size:1.15rem}
.r2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.88rem;color:var(--muted)}
.r2 .op{color:var(--ink);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{border-radius:6px;padding:1px 7px;font-weight:800;font-size:.78rem;color:#fff;background:#1565C0}
.pt.p2{background:#E65100}.pt.p3{background:#6A1B9A}
.tag{border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:#FFF3C4;color:#5C4500}.tag.red{background:#FDE2E2;color:#9B1C1C}.tag.ok{background:#E3F5EA;color:#14532D}
.bar{height:8px;border-radius:5px;background:#DCEAF5;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.bar.media i{background:var(--c-media)}.bar.total i{background:var(--c-total)}
.bar u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(0,0,0,.35)}
.bl{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.vacio{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- detalle ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sube .2s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .x{margin-left:auto;border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;font-size:1.1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.sheet h3{margin:14px 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tl li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-radius:10px;background:var(--blue-soft);font-size:.9rem}
.tl li.act{outline:2px solid var(--blue)}
.tl small{color:var(--muted);grid-column:1/-1}
.pie{border-top:2px solid var(--cyan)!important;position:fixed;left:0;right:0;bottom:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;z-index:10}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ===== Monitor SPB para celular · SOLO ADMINISTRADOR · SOLO CONSULTA =====
   Usa la misma base de datos (Supabase) que permanencias.html. No escribe nada. */
const SB_URL='https://rhsrwpxqadbczrkelsxi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoc3J3cHhxYWRiY3pya2Vsc3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTQ1NzksImV4cCI6MjEwNjA5MDU3OX0.s1SGtp7fJrD95PX9CchR_wHrtYyyNRCGcyf0KIzEXfQ';
const SB_DOMINIO='@spb.local';

const BOARD=[['enturnamiento','Enturnamiento'],['ingreso_puerta','Ingreso puerta'],['ingate','Ingreso al sistema'],['alistamiento','Alistamiento'],['entrega_operador','Entrega operador'],['outgate','Salida sistema'],['salida_puerta','Salida puerta']];
const NOM=Object.fromEntries(BOARD);
const CICLO=['ingreso_puerta','ingate','alistamiento','entrega_operador','outgate','salida_puerta'];
const PT={'1':'BSE','2':'P1','3':'P2'};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okColor=x=>/^#[0-9a-fA-F]{6}$/.test(x||'');

let SB=null,me=null,canal=null,caido=false;
let CFG={ventana:90,antes:90,perm:120};
let V={},UID2USER={},FUNC={};
let lastList='',lastSum='',lastChips='',TK={since:[],pp:[],hasta:[],bar:[]};
let stageSel='all',estSel='',q='',sheetId=null,wake=null,lastOk=0,online=navigator.onLine;

/* ---------- utilidades de tiempo (hora de Colombia) ---------- */
const TZ='America/Bogota';
const fHM=ms=>new Date(ms).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const fHMS=ms=>new Date(ms).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const pad=n=>String(n).padStart(2,'0');
const hms=ms=>{ms=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(ms/3600))+':'+pad(Math.floor(ms%3600/60))+':'+pad(ms%60)};
const mmss=ms=>{ms=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(ms/60))+':'+pad(ms%60)};
function dur(min){min=Math.round(Math.abs(min));const h=Math.floor(min/60),m=min%60;return h?(h+' h'+(m?' '+m+' min':'')):m+' min'}
const bogHoy=()=>new Date(Date.now()-5*3600e3).toISOString().slice(0,10);
const shortOp=o=>{o=String(o||'');if(/PORTUARIA REGIONAL DE BUENAVENTURA/i.test(o))return 'SPRBUN';return o.replace(/[\s,]+(S\.?\s?A\.?\s?S\.?|S\.?\s?A\.?|LTDA\.?)$/i,'').trim()};
const cheq=id=>{const f=FUNC[id];return f?String(f.nombre).split(/\s+/).slice(0,2).join(' '):''};

/* ---------- reglas de permanencia (idénticas al monitor del computador) ---------- */
const T=s=>s?new Date(s).getTime():null;
const inicioPuerta=v=>T(v.etapas.ingreso_puerta&&v.etapas.ingreso_puerta.inicio);
const inicioCiclo=v=>inicioPuerta(v)||(v.etapaActual!=='enturnamiento'?T((v.etapas[v.etapaActual]||{}).inicio):null);
const limite=v=>{const i=inicioCiclo(v);return i?i+CFG.perm*60000:null};
function estado(v,now){const l=limite(v);if(l===null)return '';if(now>=l)return 'total';if(now>=l-CFG.perm*30000)return 'media';return 'tiempo'}
const abre=v=>v.citaMs-CFG.antes*60000;
const espera=v=>v.etapaActual==='enturnamiento'&&Date.now()<abre(v)&&!v.habilitada;
const llamado=v=>!!v.llamadoHasta&&Date.now()<T(v.llamadoHasta);
const puertaDe=v=>String((v.etapas[v.etapaActual]||{}).puerta||(v.etapas.salida_puerta||{}).puerta||(v.etapas.ingreso_puerta||{}).puerta||v.puertaAsignada||'1');

/* ---------- carga de datos ---------- */
const err=r=>{if(r&&r.error)throw new Error(r.error.message||'Error de base de datos');return r&&r.data};
async function cargarPerfiles(){
  const rows=err(await SB.from('perfiles').select('id,usuario,nombre'));UID2USER={};
  (rows||[]).forEach(p=>{UID2USER[p.id]=p.nombre||p.usuario});
}
async function cargarParametros(){
  const p=err(await SB.from('parametros').select('*').eq('id',1).maybeSingle());if(!p)return;
  CFG={ventana:Math.max(5,+p.ventana_min||90),antes:p.anticipacion_min==null?90:Math.max(0,+p.anticipacion_min||0),perm:Math.max(5,+p.permanencia_min||120)};
  const r=document.documentElement.style;
  if(okColor(p.color_media))r.setProperty('--c-media',p.color_media);
  if(okColor(p.color_total))r.setProperty('--c-total',p.color_total);
}
async function cargarFuncionarios(){
  const rows=err(await SB.from('funcionarios').select('id,nombre'));FUNC={};
  (rows||[]).forEach(f=>{FUNC[f.id]={nombre:f.nombre}});
}
async function cargarVisitas(){
  const dia=bogHoy();
  const dentro=['ingreso_puerta','ingate','alistamiento','entrega_operador','outgate','salida_puerta'].join(',');
  const rows=err(await SB.from('visitas').select('*, visita_etapas(*)').neq('estado','anulada')
    .or(`dia.eq.${dia},and(estado.eq.en_proceso,etapa_actual.in.(${dentro}))`));
  const o={};
  (rows||[]).forEach(v=>{
    const et={};(v.visita_etapas||[]).forEach(e=>{et[e.etapa_id]={inicio:e.inicio,fin:e.fin,puerta:e.puerta||undefined,por:UID2USER[e.usuario_inicio]||''}});
    const id=v.placa+'_'+String(v.dia).replace(/-/g,'');
    o[id]={id,placa:v.placa,dia:v.dia,turno:v.turno||null,etapaActual:v.etapa_actual,estado:v.estado,etapas:et,
      citaMs:v.fecha_cita?new Date(v.fecha_cita).getTime():new Date(v.dia+'T00:00:00-05:00').getTime(),
      operadores:v.operadores||[],bls:v.bls||[],dos:v.delivery_orders||[],puertaAsignada:v.puerta_asignada,
      habilitada:!!v.habilitada_antes,fueVencida:!!v.fue_vencida,llamadoHasta:v.llamado_hasta||null,llamadosVencidos:v.llamados_vencidos||0,
      orden:v.orden==null?null:Number(v.orden),creado:v.created_at,chequeador:v.chequeador_id||null,chequeadorRelevo:v.chequeador_relevo_id||null,
      salidaForzada:!!v.salida_forzada};
  });
  V=o;
}
async function cargarTodo(){
  await cargarPerfiles();
  await Promise.all([cargarParametros(),cargarFuncionarios(),cargarVisitas()]);
  lastOk=Date.now();setConn(true);
}
function activas(){return Object.values(V).filter(v=>v.etapaActual&&v.etapas[v.etapaActual])}

/* ---------- tiempo real ---------- */
const timers={};
function recargar(t){
  clearTimeout(timers[t]);
  timers[t]=setTimeout(async()=>{
    try{
      if(t==='parametros')await cargarParametros();
      else if(t==='funcionarios')await cargarFuncionarios();
      else await cargarVisitas();
      lastOk=Date.now();setConn(true);pintar();
    }catch(e){console.warn(e);setConn(false)}
  },300);
}
function escuchar(){
  if(canal)SB.removeChannel(canal);
  canal=SB.channel('monitor-pwa');
  ['visitas','visita_etapas','parametros','funcionarios'].forEach(t=>canal.on('postgres_changes',{event:'*',schema:'public',table:t},()=>recargar(t==='visita_etapas'?'visitas':t)));
  canal.subscribe(st=>{
    if(st==='SUBSCRIBED'){setConn(true);if(caido){caido=false;resync()}}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){caido=true;setConn(false);setTimeout(()=>{if(me)escuchar()},4000)}
  });
}
async function resync(){try{await cargarTodo();pintar()}catch(e){console.warn(e);setConn(false)}}
function setConn(ok){online=ok&&navigator.onLine;const d=$('#dot');if(d)d.classList.toggle('off',!online);const b=$('#offb');if(b)b.hidden=online;const u=$('#pieU');if(u&&lastOk)u.textContent='Actualizado '+fHMS(lastOk)}

/* ---------- login ---------- */
function pintarLogin(msg){
  $('#app').innerHTML=`<div class="login"><form id="fl" autocomplete="on">
    <img class="logo" src="logo.png" alt="Sociedad Portuaria Buenaventura">
    <h1>Monitor de permanencias</h1><p>Solo para administradores. Es de consulta: no modifica nada.</p>
    <label>Usuario<input name="u" autocomplete="username" autocapitalize="none" autocorrect="off" required></label>
    <label>Contraseña<input name="p" type="password" autocomplete="current-password" required></label>
    <p class="err" id="le">${esc(msg||'')}</p>
    <button class="go" type="submit">Entrar</button></form></div>`;
  $('#fl').addEventListener('submit',async e=>{
    e.preventDefault();const f=e.target,b=f.querySelector('.go');
    b.disabled=true;b.textContent='Entrando…';$('#le').textContent='';
    const fin=m=>{$('#le').textContent=m;b.disabled=false;b.textContent='Entrar'};
    try{
      const r=await SB.auth.signInWithPassword({email:f.u.value.trim().toLowerCase()+SB_DOMINIO,password:f.p.value.toUpperCase()});
      if(r.error){fin(/invalid/i.test(r.error.message)?'Usuario o contraseña incorrectos.':/banned/i.test(r.error.message)?'Este usuario está desactivado.':'No se pudo entrar: '+r.error.message);return}
      const m=await verificarAdmin(r.data.user.id);
      if(m){await SB.auth.signOut();fin(m);return}
      await iniciar();
    }catch(x){fin('No se pudo entrar: '+x.message)}
  });
}
async function verificarAdmin(uid){
  const p=err(await SB.from('perfiles').select('id,usuario,nombre,rol_id,activo').eq('id',uid).maybeSingle());
  if(!p||!p.activo)return 'Este usuario está desactivado.';
  const r=err(await SB.from('roles').select('*').eq('id',p.rol_id).maybeSingle());
  if(!r||r.activo===false)return 'El rol de este usuario está desactivado.';
  if(!r.puede_admin)return 'Este monitor es solo para el administrador.';
  me={uid,usuario:p.usuario,nombre:p.nombre||p.usuario};return '';
}

/* ---------- pantalla ---------- */
function armar(){
  $('#app').innerHTML=`<header class="top">
    <div class="t1"><img class="emb" src="emblema.png" alt="SPB"><h1>Monitor SPB</h1><span class="dot" id="dot"></span><span class="clock mono" id="clk"></span>
      <button class="ib" id="bWake" title="Mantener la pantalla encendida" aria-label="Mantener pantalla encendida">🔆</button>
      <button class="ib" id="bOut" title="Salir" aria-label="Salir">⎋</button></div>
    <div class="sum" id="sum"></div>
    <div class="srch"><input id="q" type="search" placeholder="Placa, BL, DO u operador" autocomplete="off" aria-label="Buscar"><button id="qx" hidden aria-label="Limpiar">✕</button></div>
    <div class="chips" id="chips"></div></header>
  <main><p class="banner" id="offb" hidden>Sin conexión con el servidor. Se muestra lo último recibido y se reconecta solo.</p><div id="list"></div></main>
  <div class="pie"><span>${esc(me.nombre)}</span><span id="pieU"></span></div><div id="sheetBox"></div>`;
  $('#q').addEventListener('input',e=>{q=e.target.value.trim();$('#qx').hidden=!q;pintar()});
  $('#qx').onclick=()=>{q='';$('#q').value='';$('#qx').hidden=true;pintar()};
  $('#bOut').onclick=salir;
  $('#bWake').onclick=toggleWake;
  $('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b){stageSel=b.dataset.st;pintar();b.scrollIntoView({inline:'center',block:'nearest'})}});
  $('#sum').addEventListener('click',e=>{const b=e.target.closest('[data-est]');if(b){estSel=estSel===b.dataset.est?'':b.dataset.est;pintar()}});
  $('#list').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)abrirDetalle(c.dataset.id)});
  setConn(online);
}
function coincide(v){
  if(!q)return true;const t=q.toLowerCase();
  return [v.placa,...v.bls,...v.dos,...v.operadores,...v.operadores.map(shortOp)].join(' ').toLowerCase().includes(t);
}
function cardHTML(v,now){
  const et=v.etapas[v.etapaActual],est=estado(v,now),lim=limite(v),ini=inicioCiclo(v);
  const enP=v.etapaActual==='enturnamiento',esp=espera(v);
  let extra='';
  if(enP){
    if(llamado(v))extra=`<span class="tag warn mono" data-hasta="${esc(v.llamadoHasta)}">📣 00:00</span>`;
    else if(v.llamadosVencidos)extra=`<span class="tag red">📣 ${v.llamadosVencidos} vencido${v.llamadosVencidos===1?'':'s'}</span>`;
    if(esp)extra+=`<span class="tag warn">⏳ Abre ${fHM(abre(v))}</span>`;
    else if(v.fueVencida)extra+='<span class="tag red">CITA VENCIDA</span>';
    else if(v.habilitada&&Date.now()<abre(v))extra+='<span class="tag ok">Habilitado antes</span>';
  }
  const pt=(et.puerta||v.puertaAsignada);
  const ch=(v.etapaActual==='alistamiento'||v.etapaActual==='entrega_operador')?(v.chequeador&&FUNC[v.chequeador]?`<span>👷 ${esc(cheq(v.chequeador))}${v.chequeadorRelevo&&FUNC[v.chequeadorRelevo]?' → '+esc(cheq(v.chequeadorRelevo)):''}</span>`:(v.etapaActual==='alistamiento'?'<span class="tag warn">⏳ Esperando chequeador</span>':'')):'';
  return `<button class="card ${est?'est-'+est:''}${esp?' espera':''}" data-id="${esc(v.id)}" aria-label="Detalle de ${esc(v.placa)}">
    <div class="r1">${v.turno?`<span class="tno">T${esc(v.turno)}</span>`:''}<span class="plate">${esc(v.placa)}</span><span class="fill"></span><span class="timer mono" data-since="${esc(et.inicio)}">00:00:00</span></div>
    <div class="r2"><span class="op">${esc(v.operadores.map(shortOp).join(', ')||'Sin operador')}</span>${pt?`<span class="pt p${esc(pt)}">${esc(PT[pt]||'P'+pt)}</span>`:''}${ch}${extra}</div>
    ${enP?`<div class="bl"><span>Cita ${fHM(v.citaMs)}</span><span>Ventana ${fHM(abre(v))} – ${fHM(v.citaMs+CFG.ventana*60000)}</span></div>`
      :`<div class="bar ${est==='media'?'media':est==='total'?'total':''}" data-ini="${ini||''}" data-lim="${lim||''}"><i></i><u></u></div>
        <div class="bl"><span>Puerta a puerta <b class="mono" data-pp="${ini||''}">${ini?'00:00:00':'—'}</b> de ${dur(CFG.perm)}</span><span>Límite ${lim?fHM(lim):'—'}</span></div>`}
  </button>`;
}
function pintar(){
  if(!me||!$('#list'))return;
  const now=Date.now();let all=activas();
  // resumen (solo vehículos dentro del ciclo puerta a puerta)
  const cn={tiempo:0,media:0,total:0};all.forEach(v=>{const e=estado(v,now);if(e)cn[e]++});
  const sumH=`<button data-est=""${!estSel?' class="sel"':''}><b>${all.length}</b><small>EN PATIO</small></button>
    <button class="s-g${estSel==='tiempo'?' sel':''}" data-est="tiempo"><b>${cn.tiempo}</b><small>EN TIEMPO</small></button>
    <button class="s-y${estSel==='media'?' sel':''}" data-est="media"><b>${cn.media}</b><small>MITAD</small></button>
    <button class="s-r${estSel==='total'?' sel':''}" data-est="total"><b>${cn.total}</b><small>EXCEDIDOS</small></button>`;
  if(sumH!==lastSum){$('#sum').innerHTML=sumH;lastSum=sumH}
  // chips por etapa
  const cs={};all.forEach(v=>{cs[v.etapaActual]=(cs[v.etapaActual]||0)+1});
  const chipH=`<button class="chip${stageSel==='all'?' sel':''}" data-st="all">Todas<b>${all.length}</b></button>`+
    BOARD.map(([id,n])=>`<button class="chip${stageSel===id?' sel':''}" data-st="${id}">${n}<b>${cs[id]||0}</b></button>`).join('');
  if(chipH!==lastChips){const sc=$('#chips').scrollLeft;$('#chips').innerHTML=chipH;$('#chips').scrollLeft=sc;lastChips=chipH}
  // filtros
  let list=all.filter(coincide);
  if(estSel)list=list.filter(v=>v.etapaActual!=='enturnamiento'&&estado(v,now)===estSel);
  const grupos=BOARD.filter(([id])=>stageSel==='all'||stageSel===id).map(([id,n])=>{
    const items=list.filter(v=>v.etapaActual===id).sort((a,b)=>{
      if(id==='enturnamiento')return ((a.orden==null?1e12:a.orden)-(b.orden==null?1e12:b.orden))||String(a.creado).localeCompare(String(b.creado));
      const ea=estado(a,now)==='total',eb=estado(b,now)==='total';
      if(ea!==eb)return ea?-1:1;
      if(ea)return limite(a)-limite(b);
      return String(a.etapas[id].inicio).localeCompare(String(b.etapas[id].inicio));
    });
    return {id,n,items}}).filter(g=>g.items.length||stageSel!=='all');
  const html=grupos.map(g=>`<section class="group"><h2>${esc(g.n)} <span class="n">${g.items.length}</span></h2>${g.items.length?g.items.map(v=>cardHTML(v,now)).join(''):'<div class="vacio">Sin vehículos en esta etapa.</div>'}</section>`).join('');
  const out=html||`<div class="vacio">${all.length?'Ningún vehículo coincide con el filtro.':'No hay vehículos en el patio.'}</div>`;
  if(out!==lastList){
    const y=window.scrollY;$('#list').innerHTML=out;lastList=out;
    if(y)window.scrollTo(0,y);
    cacheTick();
    if(sheetId)detalle(sheetId,true);
  }
}

/* ---------- detalle ---------- */
function abrirDetalle(id){sheetId=id;detalle(id,false)}
function detalle(id,refresco){
  const v=V[id],box=$('#sheetBox');
  if(!v||!v.etapaActual){sheetId=null;box.innerHTML='';return}
  const now=Date.now(),est=estado(v,now),lim=limite(v),ini=inicioCiclo(v);
  const orden=BOARD.map(b=>b[0]).filter(k=>v.etapas[k]&&v.etapas[k].inicio);
  const tl=orden.map((k,i)=>{const e=v.etapas[k],a=T(e.inicio),f=e.fin?T(e.fin):(orden[i+1]?T(v.etapas[orden[i+1]].inicio):null);
    const act=k===v.etapaActual;
    return `<li class="${act?'act':''}"><b>${esc(NOM[k])}${e.puerta?' · '+esc(PT[e.puerta]||'P'+e.puerta):''}</b><span class="mono"${act?` data-since="${esc(e.inicio)}"`:''}>${act?'00:00:00':dur(((f||now)-a)/60000)}</span><small>${fHMS(a)}${f&&!act?' → '+fHMS(f):' → en curso'}${e.por?' · '+esc(e.por):''}</small></li>`}).join('');
  const estTxt={tiempo:'En tiempo',media:'Pasó la mitad',total:'Superó el máximo'}[est]||'Aún no entra por puerta';
  const cl={tiempo:'ok',media:'warn',total:'red'}[est]||'';
  const prev=box.querySelector('.sheet'),sc=prev?prev.scrollTop:0;
  box.innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Detalle ${esc(v.placa)}" ${refresco?'style="animation:none"':''}>
    <div class="h">${v.turno?`<span class="tno">T${esc(v.turno)}</span>`:''}<span class="plate">${esc(v.placa)}</span><button class="x" id="sx" aria-label="Cerrar">✕</button></div>
    <span class="tag ${cl}">${estTxt}</span>
    <dl class="kv">
      <dt>Etapa</dt><dd>${esc(NOM[v.etapaActual])}</dd>
      <dt>Cita</dt><dd>${fHM(v.citaMs)} <small>(ventana ${fHM(abre(v))} – ${fHM(v.citaMs+CFG.ventana*60000)})</small></dd>
      <dt>Operador</dt><dd>${esc(v.operadores.map(shortOp).join(', ')||'—')}</dd>
      <dt>BL</dt><dd>${esc(v.bls.join(', ')||'—')}</dd>
      <dt>DO</dt><dd>${esc(v.dos.join(', ')||'—')}</dd>
      <dt>Puerta</dt><dd>${esc(PT[puertaDe(v)]||'P'+puertaDe(v))}</dd>
      ${v.chequeador&&FUNC[v.chequeador]?`<dt>Chequeador</dt><dd>${esc(FUNC[v.chequeador].nombre)}${v.chequeadorRelevo&&FUNC[v.chequeadorRelevo]?' → '+esc(FUNC[v.chequeadorRelevo].nombre):''}</dd>`:''}
      ${ini?`<dt>Puerta a puerta</dt><dd><span class="mono" data-pp="${ini}">00:00:00</span> de ${dur(CFG.perm)}</dd><dt>Mitad / Límite</dt><dd>${fHM(lim-CFG.perm*30000)} / ${fHM(lim)}</dd>`:'<dt>Permanencia</dt><dd>Empieza al entrar por puerta</dd>'}
    </dl>
    <h3>Recorrido</h3><ul class="tl">${tl||'<li>Sin etapas registradas</li>'}</ul></div></div>`;
  if(refresco&&sc)box.querySelector('.sheet').scrollTop=sc;
  $('#sx').onclick=cerrarDetalle;cacheTick();
  $('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')cerrarDetalle()});
}
function cerrarDetalle(){sheetId=null;$('#sheetBox').innerHTML=''}

/* ---------- reloj y contadores en vivo ---------- */
function cacheTick(){
  TK.since=[...document.querySelectorAll('[data-since]')];TK.pp=[...document.querySelectorAll('[data-pp]')];
  TK.hasta=[...document.querySelectorAll('[data-hasta]')];TK.bar=[...document.querySelectorAll('.bar[data-lim]')];
  tick(true);
}
function setTxt(e,t){if(e.textContent!==t)e.textContent=t}
function tick(force){
  const c=$('#clk');if(c)setTxt(c,fHMS(Date.now()));
  if(document.hidden&&!force)return;
  const now=Date.now();
  TK.since.forEach(e=>{const t=T(e.dataset.since);if(t)setTxt(e,hms(now-t))});
  TK.pp.forEach(e=>{const t=+e.dataset.pp;if(t)setTxt(e,hms(now-t))});
  TK.hasta.forEach(e=>{const t=T(e.dataset.hasta);if(t)setTxt(e,'📣 '+mmss(t-now))});
  TK.bar.forEach(b=>{const i=+b.dataset.ini,l=+b.dataset.lim;if(i&&l){const w=Math.round(Math.min(100,Math.max(0,(now-i)/(l-i)*100))*10)/10;if(b._w!==w){b._w=w;b.firstElementChild.style.width=w+'%'}}});
}

/* ---------- pantalla siempre encendida ---------- */
async function toggleWake(){
  const b=$('#bWake');
  try{
    if(wake){await wake.release();wake=null;b.classList.remove('on');return}
    if(!('wakeLock' in navigator)){alert('Este navegador no permite mantener la pantalla encendida.');return}
    wake=await navigator.wakeLock.request('screen');b.classList.add('on');
    wake.addEventListener('release',()=>{wake=null;b.classList.remove('on')});
  }catch(e){console.warn(e)}
}

/* ---------- arranque ---------- */
async function iniciar(){
  armar();
  try{await cargarTodo()}catch(e){console.warn(e);setConn(false)}
  pintar();escuchar();
}
async function salir(){
  if(!confirm('¿Cerrar sesión?'))return;
  try{if(canal)SB.removeChannel(canal)}catch(_){}
  if(wake){try{await wake.release()}catch(_){}wake=null}
  await SB.auth.signOut();me=null;V={};pintarLogin('');
}
async function main(){
  if(!(window.supabase&&window.supabase.createClient)){
    $('#app').innerHTML='<div class="login"><form><h1>Sin conexión</h1><p>No se pudo cargar la librería de la base de datos. Conéctate a internet y vuelve a abrir la app.</p><button class="go" type="button" onclick="location.reload()">Reintentar</button></form></div>';return}
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-spb-monitor-admin-pwa'}});
  try{
    const {data}=await SB.auth.getSession();
    if(data&&data.session){
      const m=await verificarAdmin(data.session.user.id);
      if(!m){await iniciar();return}
      await SB.auth.signOut();pintarLogin(m);return}
  }catch(e){
    // sin red al abrir: si ya había sesión se reintenta cuando vuelva la conexión
    console.warn(e);
  }
  pintarLogin('');
}
setInterval(tick,1000);
setInterval(()=>{if(me&&!document.hidden)pintar()},15000);   // reevalúa colores y orden
setInterval(()=>{if(me&&!document.hidden&&Date.now()-lastOk>60000)resync()},30000);   // respaldo si se pierde algún evento
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!me)return;
  resync();
  if(wake===null&&$('#bWake')&&$('#bWake').classList.contains('on')){try{wake=await navigator.wakeLock.request('screen')}catch(_){}}
});
window.addEventListener('online',()=>{if(me){setConn(true);resync();escuchar()}});
window.addEventListener('offline',()=>setConn(false));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));
main();
</script>
