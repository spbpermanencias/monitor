<style>
:root{color-scheme:light;
  --bg:#F2F8FC;--panel:#fff;--ink:#0A2F5C;--muted:#52708E;--line:#D3E3F0;

html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}

.logo{width:100%;max-width:280px;height:auto;margin:0 auto 4px;display:block}

/* ---------- barra superior ---------- */
header.top{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:3px solid var(--blue);box-shadow:0 2px 8px rgba(10,85,165,.12)}

.sum small{font-size:.68rem;opacity:.85;letter-spacing:.02em}
.sum button.sel{outline:2px solid var(--blue);background:#fff}
.sum b{color:var(--blue)}.sum .s-g b{color:#15803D}.sum .s-y b{color:#B45309}.sum .s-r b{color:#C62828}
.srch{margin-top:8px;position:relative}
.srch input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:.95rem;text-transform:uppercase}

.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--blue-soft);color:var(--blue);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip b{margin-left:4px;opacity:.85}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- lista ---------- */
main{padding:10px 10px 90px}
.banner{margin:0 0 8px;padding:8px 12px;border-radius:10px;background:#FFF3C4;color:#5C4500;font-size:.88rem}
.group{margin:0 0 14px}

.r1{display:flex;align-items:center;gap:8px}
.tno{background:var(--blue);color:#fff;border-radius:8px;padding:2px 7px;font-weight:800;font-size:.85rem}

.tag.warn{background:#FFF3C4;color:#5C4500}.tag.red{background:#FDE2E2;color:#9B1C1C}.tag.ok{background:#E3F5EA;color:#14532D}

.bar.media i{background:var(--c-media)}.bar.total i{background:var(--c-total)}

.vacio{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- detalle ---------- */

.sheet{width:100%;max-height:88%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sube .2s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .x{margin-left:auto;border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;font-size:1.1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:8px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.sheet h3{margin:14px 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tl li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-radius:10px;background:var(--blue-soft);font-size:.9rem}
.tl li.act{outline:2px solid var(--blue)}
.tl small{color:var(--muted);grid-column:1/-1}
.pie{border-top:2px solid var(--cyan)!important;position:fixed;left:0;right:0;bottom:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;z-index:10}
.tabs{display:flex;gap:6px;margin-top:8px}.tabs button{flex:1;border:1px solid var(--line);background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:7px;font-weight:700;font-size:.9rem}.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rcus{display:flex;gap:6px;padding:4px 0}.rcus input{flex:1;min-width:0;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.st{display:grid;gap:12px}.st-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.st-card h2{margin:0 0 2px;font-size:1rem;color:var(--blue)}.ex{margin:0 0 10px;color:var(--muted);font-size:.82rem}
.stbar{display:flex;gap:6px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--blue-soft)}.kpi b{display:block;font-size:1.3rem;line-height:1.15;color:var(--blue)}.kpi small{color:var(--muted);font-size:.74rem}
.kpi.g b{color:#15803D}.kpi.r b{color:#C62828}.kpi.y b{color:#B45309}
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.chartwrap svg{display:block}
.hr{margin:0 0 10px}.hl{display:flex;justify-content:space-between;gap:8px;font-size:.86rem}.hl span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{height:12px;background:#DCEAF5;border-radius:6px;position:relative;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;border-radius:6px}.hb u{position:absolute;top:0;bottom:0;width:2px;background:#C62828}.hr small{color:var(--muted);font-size:.74rem}
table.dt{width:100%;min-width:560px;border-collapse:collapse;font-size:.82rem}.dt th{text-align:left;color:var(--muted);font-size:.72rem;text-transform:uppercase;padding:4px 6px;border-bottom:2px solid var(--line)}.dt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.plate.sm{font-size:.95rem;padding:0 6px;border-width:1.5px}.sq{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;text-transform:uppercase}
.phead{display:none}
@media print{header.top,.pie,#liveView,.stbar,.noprint{display:none!important}html,body{height:auto;background:#fff}main{padding:0}.st-card{break-inside:avoid;box-shadow:none}.phead{display:block;font-size:1.2rem;margin-bottom:8px}.phead img{height:40px;vertical-align:middle;margin-right:8px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.chartwrap svg{width:100%!important}.dt tr{break-inside:avoid}}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* ===== Monitor SPB para celular · SOLO ADMINISTRADOR · SOLO CONSULTA =====
   Usa la misma base de datos (Supabase) que permanencias.html. No escribe nada. */
const SB_URL='https://rhsrwpxqadbczrkelsxi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoc3J3cHhxYWRiY3pya2Vsc3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTQ1NzksImV4cCI6MjEwNjA5MDU3OX0.s1SGtp7fJrD95PX9CchR_wHrtYyyNRCGcyf0KIzEXfQ';
const SB_DOMINIO='@spb.local';

const BOARD=[['enturnamiento','Enturnamiento'],['ingreso_puerta','Ingreso puerta'],['ingate','Ingreso al sistema'],['alistamiento','Alistamiento'],['entrega_operador','Entrega operador'],['outgate','Salida sistema'],['salida_puerta','Salida puerta']];
const NOM=Object.fromEntries(BOARD);
const CICLO=['ingreso_puerta','ingate','alistamiento','entrega_operador','outgate','salida_puerta'];
const PT={'1':'BSE','2':'P1','3':'P2'};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okColor=x=>/^#[0-9a-fA-F]{6}$/.test(x||'');

let SB=null,me=null,canal=null,caido=false;
let CFG={ventana:90,antes:90,perm:120};
let V={},UID2USER={},FUNC={};
let lastList='',lastSum='',lastChips='',TK={since:[],pp:[],hasta:[],bar:[]};
let stageSel='all',estSel='',q='',sheetId=null,wake=null,lastOk=0,online=navigator.onLine;

/* ---------- utilidades de tiempo (hora de Colombia) ---------- */
const TZ='America/Bogota';
const fHM=ms=>new Date(ms).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const fHMS=ms=>new Date(ms).toLocaleTimeString('es-CO',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const pad=n=>String(n).padStart(2,'0');
const hms=ms=>{ms=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(ms/3600))+':'+pad(Math.floor(ms%3600/60))+':'+pad(ms%60)};
const mmss=ms=>{ms=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(ms/60))+':'+pad(ms%60)};
function dur(min){min=Math.round(Math.abs(min));const h=Math.floor(min/60),m=min%60;return h?(h+' h'+(m?' '+m+' min':'')):m+' min'}
const bogHoy=()=>new Date(Date.now()-5*3600e3).toISOString().slice(0,10);
const shortOp=o=>{o=String(o||'');if(/PORTUARIA REGIONAL DE BUENAVENTURA/i.test(o))return 'SPRBUN';return o.replace(/[\s,]+(S\.?\s?A\.?\s?S\.?|S\.?\s?A\.?|LTDA\.?)$/i,'').trim()};
const cheq=id=>{const f=FUNC[id];return f?String(f.nombre).split(/\s+/).slice(0,2).join(' '):''};

/* ---------- reglas de permanencia (idénticas al monitor del computador) ---------- */
const T=s=>s?new Date(s).getTime():null;
const inicioPuerta=v=>T(v.etapas.ingreso_puerta&&v.etapas.ingreso_puerta.inicio);
const inicioCiclo=v=>inicioPuerta(v)||(v.etapaActual!=='enturnamiento'?T((v.etapas[v.etapaActual]||{}).inicio):null);
const limite=v=>{const i=inicioCiclo(v);return i?i+CFG.perm*60000:null};
function estado(v,now){const l=limite(v);if(l===null)return '';if(now>=l)return 'total';if(now>=l-CFG.perm*30000)return 'media';return 'tiempo'}
const abre=v=>v.citaMs-CFG.antes*60000;
const espera=v=>v.etapaActual==='enturnamiento'&&Date.now()<abre(v)&&!v.habilitada;
const llamado=v=>!!v.llamadoHasta&&Date.now()<T(v.llamadoHasta);
const puertaDe=v=>String((v.etapas[v.etapaActual]||{}).puerta||(v.etapas.salida_puerta||{}).puerta||(v.etapas.ingreso_puerta||{}).puerta||v.puertaAsignada||'1');

/* ---------- carga de datos ---------- */
const err=r=>{if(r&&r.error)throw new Error(r.error.message||'Error de base de datos');return r&&r.data};
async function cargarPerfiles(){
  const rows=err(await SB.from('perfiles').select('id,usuario,nombre'));UID2USER={};
  (rows||[]).forEach(p=>{UID2USER[p.id]=p.nombre||p.usuario});
}
async function cargarParametros(){
  const p=err(await SB.from('parametros').select('*').eq('id',1).maybeSingle());if(!p)return;
  CFG={ventana:Math.max(5,+p.ventana_min||90),antes:p.anticipacion_min==null?90:Math.max(0,+p.anticipacion_min||0),perm:Math.max(5,+p.permanencia_min||120)};
  const r=document.documentElement.style;
  if(okColor(p.color_media))r.setProperty('--c-media',p.color_media);
  if(okColor(p.color_total))r.setProperty('--c-total',p.color_total);
}
async function cargarFuncionarios(){
  const rows=err(await SB.from('funcionarios').select('id,nombre'));FUNC={};
  (rows||[]).forEach(f=>{FUNC[f.id]={nombre:f.nombre}});
}
async function cargarVisitas(){
  const dia=bogHoy();
  const dentro=['ingreso_puerta','ingate','alistamiento','entrega_operador','outgate','salida_puerta'].join(',');
  const rows=err(await SB.from('visitas').select('*, visita_etapas(*)').neq('estado','anulada')
    .or(`dia.eq.${dia},and(estado.eq.en_proceso,etapa_actual.in.(${dentro}))`));
  const o={};
  (rows||[]).forEach(v=>{
    const et={};(v.visita_etapas||[]).forEach(e=>{et[e.etapa_id]={inicio:e.inicio,fin:e.fin,puerta:e.puerta||undefined,por:UID2USER[e.usuario_inicio]||''}});
    const id=v.placa+'_'+String(v.dia).replace(/-/g,'');
    o[id]={id,placa:v.placa,dia:v.dia,turno:v.turno||null,etapaActual:v.etapa_actual,estado:v.estado,etapas:et,
      citaMs:v.fecha_cita?new Date(v.fecha_cita).getTime():new Date(v.dia+'T00:00:00-05:00').getTime(),
      operadores:v.operadores||[],bls:v.bls||[],dos:v.delivery_orders||[],puertaAsignada:v.puerta_asignada,
      habilitada:!!v.habilitada_antes,fueVencida:!!v.fue_vencida,llamadoHasta:v.llamado_hasta||null,llamadosVencidos:v.llamados_vencidos||0,
      orden:v.orden==null?null:Number(v.orden),creado:v.created_at,chequeador:v.chequeador_id||null,chequeadorRelevo:v.chequeador_relevo_id||null,
      salidaForzada:!!v.salida_forzada};
  });
  V=o;
}
async function cargarTodo(){
  await cargarPerfiles();
  await Promise.all([cargarParametros(),cargarFuncionarios(),cargarVisitas()]);
  lastOk=Date.now();setConn(true);
}
function activas(){return Object.values(V).filter(v=>v.etapaActual&&v.etapas[v.etapaActual])}

/* ---------- tiempo real ---------- */
const timers={};
function recargar(t){
  clearTimeout(timers[t]);
  timers[t]=setTimeout(async()=>{
    try{
      if(t==='parametros')await cargarParametros();
      else if(t==='funcionarios')await cargarFuncionarios();
      else await cargarVisitas();
      lastOk=Date.now();setConn(true);pintar();
    }catch(e){console.warn(e);setConn(false)}
  },300);
}
function escuchar(){
  if(canal)SB.removeChannel(canal);
  canal=SB.channel('monitor-pwa');
  ['visitas','visita_etapas','parametros','funcionarios'].forEach(t=>canal.on('postgres_changes',{event:'*',schema:'public',table:t},()=>recargar(t==='visita_etapas'?'visitas':t)));
  canal.subscribe(st=>{
    if(st==='SUBSCRIBED'){setConn(true);if(caido){caido=false;resync()}}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){caido=true;setConn(false);setTimeout(()=>{if(me)escuchar()},4000)}
  });
}
async function resync(){try{await cargarTodo();pintar()}catch(e){console.warn(e);setConn(false)}}
function setConn(ok){online=ok&&navigator.onLine;const d=$('#dot');if(d)d.classList.toggle('off',!online);const b=$('#offb');if(b)b.hidden=online;const u=$('#pieU');if(u&&lastOk)u.textContent='Actualizado '+fHMS(lastOk)}

/* ---------- login ---------- */
function pintarLogin(msg){
  $('#app').innerHTML=`<div class="login"><form id="fl" autocomplete="on">
    <img class="logo" src="logo.png" alt="Sociedad Portuaria Buenaventura">
    <h1>Monitor de permanencias</h1><p>Solo para administradores. Es de consulta: no modifica nada.</p>
    <label>Usuario<input name="u" autocomplete="username" autocapitalize="none" autocorrect="off" required></label>
    <label>Contraseña<input name="p" type="password" autocomplete="current-password" required></label>
    <p class="err" id="le">${esc(msg||'')}</p>
    <button class="go" type="submit">Entrar</button></form></div>`;
  $('#fl').addEventListener('submit',async e=>{
    e.preventDefault();const f=e.target,b=f.querySelector('.go');
    b.disabled=true;b.textContent='Entrando…';$('#le').textContent='';
    const fin=m=>{$('#le').textContent=m;b.disabled=false;b.textContent='Entrar'};
    try{
      const r=await SB.auth.signInWithPassword({email:f.u.value.trim().toLowerCase()+SB_DOMINIO,password:f.p.value.toUpperCase()});
      if(r.error){fin(/invalid/i.test(r.error.message)?'Usuario o contraseña incorrectos.':/banned/i.test(r.error.message)?'Este usuario está desactivado.':'No se pudo entrar: '+r.error.message);return}
      const m=await verificarAdmin(r.data.user.id);
      if(m){await SB.auth.signOut();fin(m);return}
      await iniciar();
    }catch(x){fin('No se pudo entrar: '+x.message)}
  });
}
async function verificarAdmin(uid){
  const p=err(await SB.from('perfiles').select('id,usuario,nombre,rol_id,activo').eq('id',uid).maybeSingle());
  if(!p||!p.activo)return 'Este usuario está desactivado.';
  const r=err(await SB.from('roles').select('*').eq('id',p.rol_id).maybeSingle());
  if(!r||r.activo===false)return 'El rol de este usuario está desactivado.';
  if(!r.puede_admin)return 'Este monitor es solo para el administrador.';
  me={uid,usuario:p.usuario,nombre:p.nombre||p.usuario};return '';
}

function pintarStats(){
  const bx=$('#statsView');if(!bx)return;
  if(!ST){bx.innerHTML=stErr?`<div class="vacio">No se pudieron cargar los datos.<br><small>${esc(stErr)}</small><br><br><button class="chip sel" data-a="re">Reintentar</button></div>`:sin('Cargando estadísticas…');return}
  const L=CFG.perm,now=Date.now(),R=ST.recs,Hh=R.filter(r=>r.perm!=null),Cu=R.filter(r=>r.cur),P=Hh.map(r=>r.perm),nH=Hh.length;
  const cl={tiempo:0,media:0,total:0};Hh.forEach(r=>cl[clase(r.perm,L)]++);
  const pc=k=>nH?Math.round(cl[k]/nH*100):0,cuExc=Cu.filter(r=>(now-r.ip)/6e4>=L).length;
  const grp=(f,rs)=>{const m={};rs.forEach(r=>{const k=f(r);(m[k]=m[k]||[]).push(r.perm)});return m};
  const BH=grp(r=>horaBog(r.ip),Hh),hk=Object.keys(BH).map(Number),hi=[];
  for(let h=Math.min(...hk);h<=Math.max(...hk)&&hk.length;h++){const a=BH[h],v=a?(hrMode==='max'?Math.max(...a):avg(a)):null;hi.push({l:pad(h)+'h',v,c:v==null?'':COL[clase(v,L)],s:a?a.length+' veh':''})}
  const worst=hi.filter(i=>i.v!=null).sort((a,b)=>b.v-a.v)[0];
  const BD=grp(r=>r.dia,Hh),di=Object.keys(BD).sort().map(d=>{const v=avg(BD[d]);return{l:ddmm(d),v,c:COL[clase(v,L)],s:BD[d].length+' veh'}});
  const SE=BOARD.map(([k,n])=>{const a=R.map(r=>r.dd[k]).filter(x=>x!=null);return{k,l:n,v:avg(a),n:a.length}}).filter(s=>s.v!=null);
  const slow=SE.filter(s=>s.k!=='enturnamiento').sort((a,b)=>b.v-a.v)[0],smx=Math.max(1,...SE.map(s=>s.v));
  const BO={};Hh.forEach(r=>(r.ops.length?[...new Set(r.ops)]:['Sin operador']).forEach(o=>(BO[o]=BO[o]||[]).push(r.perm)));
  const oo=Object.entries(BO).sort((a,b)=>b[1].length-a[1].length).slice(0,10).map(([o,a])=>{const v=avg(a),e=a.filter(x=>x>=L).length;return{l:o,v,c:COL[clase(v,L)],r:dur(v),s:a.length+' veh. · '+e+' excedido'+(e===1?'':'s')}});
  const omx=Math.max(L*1.1,...oo.map(o=>o.v)),k=(v,t,c)=>`<div class="kpi ${c||''}"><b>${v}</b><small>${t}</small></div>`,cnt=f=>R.filter(f).length;
  const cuad=[['tiempo','En tiempo (menos de '+dur(L/2)+')'],['media','Pasó la mitad ('+dur(L/2)+' a '+dur(L)+')'],['total','Excedido (más de '+dur(L)+')']].map(([c,t])=>({l:t,v:pc(c),c:COL[c],r:cl[c]+' · '+pc(c)+'%'}));
  bx.innerHTML=`<div class="phead"><img src="logo.png" alt="">Reporte de permanencias</div>
  <div class="stbar noprint"><button class="chip" data-a="ref">↻ Actualizar</button><button class="chip" data-a="csv">⬇ Excel (CSV)</button><button class="chip" data-a="pdf">📄 PDF</button></div>
  <p class="ex">Del ${fd(ST.d)} al ${fd(ST.h)} · actualizado ${fHMS(ST.t)}${stLoad?' · actualizando…':''}</p>
  <div class="kpis">${k(R.length,'Vehículos registrados')}${k(nH,'Con ciclo completo')}${k(nH?dur(avg(P)):'—','Permanencia promedio')}${k(nH?dur(med(P)):'—','Mediana (el vehículo típico)')}${k(nH?dur(Math.max(...P)):'—','Permanencia máxima','r')}${k(nH?(pc('tiempo')+pc('media'))+'%':'—','Cumplen el límite de '+dur(L),'g')}${k(cl.total,'Excedieron el límite','r')}${k(Cu.length,'En curso ahora'+(cuExc?' ('+cuExc+' ya excedidos)':''),'y')}</div>
  <section class="st-card"><h2>Novedades operativas</h2><div class="kpis">${k(cnt(r=>r.cv),'Citas vencidas')}${k(R.reduce((s,r)=>s+r.ven,0),'Llamados vencidos')}${k(cnt(r=>r.sf),'Salidas forzadas')}${k(cnt(r=>r.hab),'Habilitados antes de hora')}</div></section>
  <section class="st-card"><h2>Cumplimiento del límite</h2><p class="ex">Permanencia = de que entra por puerta hasta que sale. Solo vehículos con ciclo completo${nH?'; 9 de cada 10 salen en menos de '+dur([...P].sort((a,b)=>a-b)[Math.max(0,Math.ceil(nH*.9)-1)]):''}.</p>${nH?hrows(cuad,100):sin('Aún no hay vehículos con ciclo completo en este rango.')}</section>
  <section class="st-card"><h2>Horas vs permanencia</h2><p class="ex">Cada barra es la permanencia (minutos) de los vehículos que entraron por puerta a esa hora; debajo, cuántos fueron. La línea roja es el límite.${worst?' Hora más lenta: '+worst.l+' ('+Math.round(worst.v)+' min).':''}</p>
   <div class="stbar noprint" style="margin-bottom:6px"><button class="chip${hrMode==='prom'?' sel':''}" data-a="hp">Promedio</button><button class="chip${hrMode==='max'?' sel':''}" data-a="hm">Máximo</button></div>${hi.length?chartV(hi,{limit:L}):sin('Sin datos en este rango.')}</section>
  ${di.length>1?`<section class="st-card"><h2>Permanencia por día</h2><p class="ex">Promedio diario en minutos frente al límite.</p>${chartV(di,{limit:L})}</section>`:''}
  <section class="st-card"><h2>Tiempo por etapa</h2><p class="ex">Promedio que pasan los vehículos en cada etapa.${slow?' La etapa más lenta del ciclo es '+slow.l+' ('+dur(slow.v)+').':''}</p>${SE.length?hrows(SE.map(s=>({l:s.l,v:s.v,c:slow&&s.k===slow.k?'var(--yellow)':'var(--blue)',r:dur(s.v),s:s.n+' registros'})),smx):sin('Sin datos.')}</section>
  <section class="st-card"><h2>Por operador</h2><p class="ex">Los 10 con más vehículos. Barra = permanencia promedio; la marca roja es el límite.</p>${oo.length?hrows(oo,omx,L):sin('Sin datos.')}</section>
  <section class="st-card"><h2>Detalle de vehículos</h2><div class="stbar noprint" style="margin-bottom:8px"><button class="chip${stSort==='rec'?' sel':''}" data-a="so-rec">Recientes</button><button class="chip${stSort==='max'?' sel':''}" data-a="so-max">Mayor permanencia</button><button class="chip${stSort==='exc'?' sel':''}" data-a="so-exc">Solo excedidos</button></div>
   <input class="sq noprint" id="sq" type="search" placeholder="Placa, BL, DO u operador" value="${esc(stQ)}" autocomplete="off"><div id="stRows">${filasStats()}</div></section>`}
async function cargarStats(force,silent){
  const[d,h]=rango(),key=d+'|'+h;
  if(!force&&ST&&ST.key===key&&Date.now()-ST.t<60000){pintarStats();return}
  const tok=++stTok;stLoad=true;stErr='';if(ST&&ST.key!==key)ST=null;if(!silent||!ST)pintarStats();
  try{const rows=await traerStats(d,h);if(tok!==stTok)return;ST={key,d,h,t:Date.now(),recs:rows.map(proc)}}
  catch(e){if(tok!==stTok)return;console.warn(e);stErr=e.message||'Error'}
  stLoad=false;pintarStats()}
function bajarCSV(){if(!ST)return;const E=BOARD.map(b=>b[0]);
  const rows=[['Fecha','Placa','Turno','Operador(es)','BL','DO','Puerta','Entrada puerta','Salida','Permanencia (min)','Llamados vencidos','Cita vencida','Habilitado antes','Salida forzada',...E.map(k=>NOM[k]+' (min)')]];
  ST.recs.forEach(r=>rows.push([r.dia,r.placa,r.turno,r.op,r.bls,r.dos,r.pu,r.ip?fHMS(r.ip):'',r.fin?fHMS(r.fin):'',r.perm==null?'':Math.round(r.perm),r.ven,r.cv?'Sí':'No',r.hab?'Sí':'No',r.sf?'Sí':'No',...E.map(k=>r.dd[k]==null?'':Math.round(r.dd[k]))]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`permanencias_${ST.d}_${ST.h}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function imprimir(){stShow=1e9;pintarStats();window.addEventListener('afterprint',()=>{stShow=100;pintarStats()},{once:true});setTimeout(()=>window.print(),80)}
function vistaSet(v){vista=v;const s=v==='stats';$('#liveHead').hidden=s;$('#statHead').hidden=!s;$('#liveView').hidden=s;$('#statsView').hidden=!s;$('#tV').classList.toggle('on',!s);$('#tS').classList.toggle('on',s);window.scrollTo(0,0);if(s)cargarStats(false);else pintar()}
function initStats(){
  const pr=()=>{$('#rchips').innerHTML=RNGS.map(([k,n])=>`<button class="chip${RNG===k?' sel':''}" data-r="${k}">${n}</button>`).join('');$('#rcus').hidden=RNG!=='rango'};pr();
  $('#tV').onclick=()=>vistaSet('vivo');$('#tS').onclick=()=>vistaSet('stats');
  $('#rchips').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;RNG=b.dataset.r;stShow=100;pr();
    if(RNG==='rango'){const h=bogHoy();RD={d:RD.d||h,h:RD.h||h};$('#rd').value=RD.d;$('#rh').value=RD.h}cargarStats(true)};
  $('#rgo').onclick=()=>{RD={d:$('#rd').value,h:$('#rh').value};cargarStats(true)};
  const sv=$('#statsView');
  sv.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='re'||a==='ref')cargarStats(true);else if(a==='csv')bajarCSV();else if(a==='pdf')imprimir();
    else if(a==='more'){stShow+=100;$('#stRows').innerHTML=filasStats()}
    else if(a==='hp'||a==='hm'){hrMode=a==='hp'?'prom':'max';pintarStats()}
    else if(a.startsWith('so-')){stSort=a.slice(3);stShow=100;pintarStats()}};
  sv.oninput=e=>{if(e.target.id==='sq'){stQ=e.target.value.trim();stShow=100;$('#stRows').innerHTML=filasStats()}}}

/* ---------- arranque ---------- */
async function iniciar(){
  armar();
  try{await cargarTodo()}catch(e){console.warn(e);setConn(false)}
  pintar();escuchar();
}
async function salir(){
  if(!confirm('¿Cerrar sesión?'))return;
  try{if(canal)SB.removeChannel(canal)}catch(_){}
  if(wake){try{await wake.release()}catch(_){}wake=null}
  await SB.auth.signOut();me=null;V={};ST=null;vista='vivo';pintarLogin('');
}
async function main(){
  if(!(window.supabase&&window.supabase.createClient)){
    $('#app').innerHTML='<div class="login"><form><h1>Sin conexión</h1><p>No se pudo cargar la librería de la base de datos. Conéctate a internet y vuelve a abrir la app.</p><button class="go" type="button" onclick="location.reload()">Reintentar</button></form></div>';return}
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sb-spb-monitor-admin-pwa'}});
  try{
    const {data}=await SB.auth.getSession();
    if(data&&data.session){
      const m=await verificarAdmin(data.session.user.id);
      if(!m){await iniciar();return}
      await SB.auth.signOut();pintarLogin(m);return}
  }catch(e){
    // sin red al abrir: si ya había sesión se reintenta cuando vuelva la conexión
    console.warn(e);
  }
  pintarLogin('');
}
setInterval(tick,1000);
setInterval(()=>{if(me&&!document.hidden)pintar()},15000);   // reevalúa colores y orden
setInterval(()=>{if(me&&!document.hidden&&Date.now()-lastOk>60000)resync()},30000);   // respaldo si se pierde algún evento
setInterval(()=>{if(me&&vista==='stats'&&!document.hidden&&!stLoad&&ST&&rango()[1]>=bogHoy()&&document.activeElement.id!=='sq')cargarStats(true,true)},45000);
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!me)return;
  resync();
  if(wake===null&&$('#bWake')&&$('#bWake').classList.contains('on')){try{wake=await navigator.wakeLock.request('screen')}catch(_){}}
});
window.addEventListener('online',()=>{if(me){setConn(true);resync();escuchar()}});
window.addEventListener('offline',()=>setConn(false));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));
main();
</script>
